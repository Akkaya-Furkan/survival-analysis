[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p30-survival-analysis"
version = "0.1.0"
description = "Reproducible NCCTG Kaplan–Meier and Cox analysis"
requires-python = ">=3.11,<3.12"
dependencies = ["lifelines==0.30.0", "numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3", "matplotlib==3.10.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
